name: Build Linux x64 Deb Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential dpkg-dev fakeroot

      - name: Build deb package
        run: |
          set -e
          REPO_ROOT="$GITHUB_WORKSPACE"
          ./build-linux-deb.sh deb

      - name: Show artifacts
        run: |
          echo "======================================"
          echo "Build complete!"
          echo "Artifacts: $GITHUB_WORKSPACE"
          ls -lh "$GITHUB_WORKSPACE"/Moonfin_*.deb 2>/dev/null || echo "(no deb built)"
          echo "======================================"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonfin-x64-deb
          path: Moonfin_*.deb
