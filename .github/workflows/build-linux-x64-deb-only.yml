name: Build Linux x64 DEB Only (GitHub Actions)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-deb:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ./target
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system build deps
        run: |
          sudo apt update -y
          sudo apt install -y libgtk-4-dev libadwaita-1-dev libmpdclient-dev build-essential dpkg git

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run dedicated deb build script
        run: |
          chmod +x ./build-linux-deb.sh
          ./build-linux-deb.sh

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: tsukimi-linux-x64-deb
          path: ./deb_output/*.deb
